<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mathe-Uebung Prototyp</title>
  <link rel="stylesheet" href="style.css" />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/katex@0.18.9/dist/katex.min.css"
    integrity="sha384-lPx0C4zIUZLpveABMwOFcFeGZwsvKBJfhJ85FN1PYOV7xApBcFMhcAEMVKF8loOI"
    crossorigin="anonymous"
  />
</head>
<body>
  <div class="app-layout">
    <nav class="sidebar">
      <h1>Mathe-Übung</h1>
      <button id="nav-start" class="nav-btn active">🏠 Start</button>
      <button id="nav-uebung" class="nav-btn">📖 Übungsmodus</button>
      <button id="nav-pruefung" class="nav-btn">📝 Prüfungsmodus</button>
      <button id="nav-history" class="nav-btn">📊 Meine Ergebnisse</button>
      <p id="stars-total" class="stars-total hidden"></p>
      <div id="level-info" class="level-info hidden">
        <p id="level-title" class="level-title"></p>
        <div class="level-progress-track">
          <div id="level-progress-fill" class="level-progress-fill"></div>
        </div>
        <p id="level-next" class="level-next"></p>
      </div>
    </nav>

    <main>
    <!-- Startbildschirm: Name eingeben -->
    <section id="screen-start" class="screen">
      <h2>Willkommen!</h2>
      <label for="player-name">Dein Name:</label>
      <input id="player-name" type="text" maxlength="60" placeholder="z.B. Alex" />
      <p>Wähle links einen Modus, um loszulegen.</p>
    </section>

    <!-- Uebungsmodus: Aufgabe nach Jahr/Kategorie auswaehlen -->
    <section id="screen-uebung-setup" class="screen hidden">
      <h2>Übungsmodus</h2>
      <label for="uebung-year">Jahr:</label>
      <select id="uebung-year"><option value="">Alle Jahre</option></select>

      <label for="uebung-category">Kategorie:</label>
      <select id="uebung-category"><option value="">Alle Kategorien</option></select>

      <label for="uebung-problem">Aufgabe:</label>
      <select id="uebung-problem"></select>

      <div class="toolbar">
        <button id="btn-uebung-start">Starten</button>
      </div>
    </section>

    <!-- Pruefungsmodus: nach Jahr oder Kategorie, dann Wert waehlen -->
    <section id="screen-pruefung-setup" class="screen hidden">
      <h2>Prüfungsmodus</h2>
      <div class="mode-buttons">
        <button id="btn-pruefung-jahr" class="variant-btn">Nach Jahr</button>
        <button id="btn-pruefung-kategorie" class="variant-btn">Nach Kategorie</button>
      </div>

      <div id="pruefung-jahr-picker" class="hidden">
        <label for="pruefung-year">Jahr:</label>
        <select id="pruefung-year"></select>
      </div>

      <div id="pruefung-kategorie-picker" class="hidden">
        <label for="pruefung-category">Kategorie:</label>
        <select id="pruefung-category"></select>
      </div>

      <div class="toolbar">
        <button id="btn-pruefung-start" class="hidden">Prüfung starten</button>
      </div>
    </section>

    <!-- Gemeinsamer Aufgaben-Bildschirm (Uebung: 1 Aufgabe, Pruefung: mehrere nacheinander) -->
    <section id="screen-task" class="screen hidden">
      <p id="task-progress" class="task-progress hidden"></p>
      <p id="problem-text" class="problem-text"></p>
      <div id="problem-images" class="problem-images"></div>

      <section class="canvas-wrap">
        <canvas id="notebook" width="800" height="500"></canvas>
        <div class="toolbar">
          <button id="tool-pen" class="tool-btn active">✏️ Stift</button>
          <button id="tool-eraser" class="tool-btn">🧽 Radierer</button>
          <button id="clear-btn">Alles löschen</button>
          <button id="submit-btn">Abgeben</button>
          <button id="hint-btn" class="hint-btn" title="Hinweis anzeigen (kostet die Punkte dieser Aufgabe)">💡 Hinweis</button>
        </div>
        <p id="hint-box" class="hint-box hidden"></p>
      </section>

      <section id="result" class="result hidden">
        <h2>Ergebnis</h2>
        <p><strong>Erkannte Antwort:</strong> <span id="result-transcription"></span></p>
        <p><strong>Deine Lösung (erkannt):</strong></p>
        <div id="result-latex-rendered"></div>
        <p><strong>Bewertung:</strong> <span id="result-correct"></span></p>
        <p><strong>Feedback:</strong> <span id="result-feedback"></span></p>
        <button id="btn-play-bonus-game" class="hint-btn hidden">🎮 Bonus-Spiel spielen (+1 ⭐)</button>
        <button id="btn-next">Weiter</button>
      </section>

      <p id="status" class="status"></p>
    </section>

    <!-- Zusammenfassung am Ende einer Pruefung -->
    <section id="screen-summary" class="screen hidden">
      <h2>Ergebnis der Prüfung</h2>
      <p id="summary-score" class="summary-score"></p>
      <p id="summary-stars" class="summary-stars"></p>
      <div class="toolbar">
        <button id="btn-summary-restart">Zurück zur Startseite</button>
      </div>
    </section>

    <!-- Verlauf/Ergebnisse eines Namens -->
    <section id="screen-history" class="screen hidden">
      <h2>Meine Ergebnisse</h2>
      <div id="history-list"></div>
    </section>
    </main>
  </div>

  <!-- Level-Aufstieg: Konfetti + Glueckwunschmeldung -->
  <div id="level-up-overlay" class="level-up-overlay hidden">
    <div id="confetti-container" class="confetti-container"></div>
    <div class="level-up-card">
      <h2>🎉 Herzlichen Glückwunsch! 🎉</h2>
      <p id="level-up-message"></p>
      <button id="btn-level-up-close">Weiter</button>
    </div>
  </div>

  <!-- Bonus-Merkspiel nach richtig geloester Uebungsaufgabe -->
  <div id="minigame-overlay" class="level-up-overlay hidden">
    <div class="level-up-card">
      <h2>🎮 Bonus-Spiel</h2>
      <p>Finde alle 8 Paare, bevor die Zeit abläuft!</p>
      <p id="minigame-timer" class="minigame-timer"></p>
      <div id="minigame-grid" class="minigame-grid"></div>
      <p id="minigame-result" class="minigame-result hidden"></p>
      <button id="btn-minigame-close">Schliessen</button>
    </div>
  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/katex@0.18.9/dist/katex.min.js"
    integrity="sha384-19KE2cFb3U+RUWmyhBz7aLOGDG8WrRC6hE3oY/HTZZlAAVWYTdmvLC//+TIV3zUx"
    crossorigin="anonymous"
  ></script>
  <script src="app.js"></script>
</body>
</html>
